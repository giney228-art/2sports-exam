<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2학년 체육 온라인 시험</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @font-face {
      font-family: 'NanumSquareRound';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    body { font-family: 'NanumSquareRound', sans-serif; background-color: #f3f4f6; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ★★★ 선생님의 구글 웹앱 URL이 완벽하게 적용되었습니다! ★★★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyxS6W-SjTyih-m2CrKDa3DauSOcI1R60cltTFZaXMnqHwnC0GZKqGQpwnDwuCYkGEIvQ/exec";

    function App() {
      const [examStatus, setExamStatus] = useState(() => {
        const saved = sessionStorage.getItem('current_exam_state');
        if (saved === 'finished') return 'finished';
        if (saved === 'terminated') return 'terminated';
        return 'setup';
      }); 
      
      const [adminPassword, setAdminPassword] = useState('');
      const [adminError, setAdminError] = useState('');
      const [submissions, setSubmissions] = useState([]);
      const [selectedClassFilter, setSelectedClassFilter] = useState('all');

      const [studentInfo, setStudentInfo] = useState({ grade: 2, classNo: 1, studentNo: 1, name: '' });
      const [answers, setAnswers] = useState({});
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      
      const [showConfirmModal, setShowConfirmModal] = useState(false);
      const [alertMessage, setAlertMessage] = useState('');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      const EXAM_TIME_SECONDS = 40 * 60; 
      const [timeLeft, setTimeLeft] = useState(EXAM_TIME_SECONDS);
      const timerRef = useRef(null);

      // ※ 여기에 2학년 문제들이 들어갈 자리입니다! (현재는 임시 야구 문제 데이터)
      const questions = [
        { id: 1, type: 'multiple-choice', points: 1, correctAnswer: 0, text: "야구에서 공격 팀이 1점을 얻기 위해 타자나 주자가 반드시 순서대로 거쳐야 하는 베이스 경로로 옳은 것을 고르시오.", options: ["1루->2루->3루->홈", "3루->2루->1루->홈", "1루->3루->2루->홈", "2루->3루->1루->홈"] },
        { id: 2, type: 'multiple-choice', points: 1, correctAnswer: 1, text: "플레이트 야구에서 투수가 공을 굴려주는 기구의 이름을 고르시오.", options: ["평균대", "경사판", "티볼대", "구령대"] },
        { id: 3, type: 'multiple-choice', points: 1, correctAnswer: 1, text: "수비수가 공중에 떠 있는 타구를 땅에 닿기 전에 포구(플라이 아웃)했을 때, 미리 출발했던 주자는 공을 잡자마자 귀루하지 않고 자유롭게 다음 베이스로 달릴 수 있다.", options: ["O (맞다)", "X (틀리다)"] },
        { id: 4, type: 'short-answer', points: 1, correctAnswer: "1", text: "주자가 없는 상황에서 타자가 친 공을 수비수가 잡았다. 이때 수비수가 던져야 하는 루(베이스)의 숫자는? (숫자만 쓰시오)" },
        { id: 5, type: 'multiple-choice', points: 2, correctAnswer: 2, text: "플라이 아웃(뜬공 아웃)이 발생했을 때, 베이스에 있던 주자가 지켜야 하는 '리터치(Tag-up)' 규칙으로 올바른 것은?", options: ["타구가 공중에 뜨는 즉시 무조건 다음 베이스로 뛰어가서 살아야한다.", "플라이 아웃이 되면 베이스에 있던 주자도 무조건 자동으로 아웃된다.", "수비수가 공을 포구하는 순간 기존 베이스를 다시 밟은 후 다음 루로 진루를 시도할 수 있다.", "플라이 아웃 시 주자는 수비수의 허락을 받아야만 다음 루로 이동할 수 있다."] },
        { id: 6, type: 'multiple-choice', points: 1, correctAnswer: 2, text: "주자가 현재 1루, 3루에 있는 상황이다. 이때 민혁이가 친 공이 담장 밖으로 넘어가 홈런이 되었다. 이때 민혁이의 팀이 얻은 점수는?", options: ["1점", "2점", "3점", "4점"] },
        { id: 7, type: 'multiple-choice', points: 1, correctAnswer: 1, text: "투수가 던진 공을 타자가 헛스윙하거나, 친 공이 1,3루 라인 바깥으로 간 경우에 올라가는 숫자가 의미하는 것은?", options: ["볼", "스트라이크", "아웃", "실책"] },
        { id: 8, type: 'multiple-choice', points: 1, correctAnswer: 2, text: "타자가 쳐낸 공이 1루나 3루 바깥쪽 라인 너머로 날아가거나 굴러가 구장을 벗어난 타구를 무엇이라고 하는가?", options: ["안타", "볼넷", "파울", "홈런"] },
        { id: 9, type: 'multiple-choice', points: 2, correctAnswer: 0, text: "주자 1루 상황에서 타자가 내야 땅볼을 쳤다. 2루수가 공을 잡아 2루 베이스를 밟아 1루 주자를 아웃시키고, 곧바로 1루로 공을 던져 타자 주자보다 먼저 1루수가 공을 잡고 베이스를 밟아 아웃시켰다. 이때 일어난 두 아웃의 아웃 종류는?", options: ["첫번째와 두번째 모두 '포스 아웃'이다.", "첫번째는 '태그 아웃', 두번째는 '포스 아웃'이다.", "첫번째와 두번째 모두 '태그 아웃'이다.", "첫번째는 '포스 아웃', 두번째는 '태그 아웃'이다."] },
        { id: 10, type: 'multiple-choice', points: 1, correctAnswer: 2, text: "야구 경기에서 타자가 친 공이 땅에 닿은 후 파울 라인 안쪽(인플레이 지역)에 떨어져, 타자가 아웃되지 않고 안전하게 베이스로 출루한 타구를 무엇이라고 하는가?", options: ["볼넷", "삼진", "안타", "파울"] },
        { id: 11, type: 'multiple-choice', points: 2, correctAnswer: 1, text: "다음 중 무조건 진루(다음 베이스로 이동)하지 않아도 되는 사람을 고르시오.", options: ["주자 만루 상황에서 3루 주자인 창엽", "주자 1, 3루 상황에서 3루 주자인 현빈", "주자 1, 3루 상황에서 1루 주자인 창은", "주자 1, 2루 상황에서 2루 주자인 휘강"] },
        { id: 12, type: 'multiple-choice', points: 2, correctAnswer: 2, text: "노아웃 주자 3루 상황에서 타자가 외야 깊숙한 뜬공을 쳤다. 외야수가 공을 잡는 순간 3루 주자는 3루 베이스를 밟고 있다가 홈으로 달리기 시작하여 수비의 태그보다 먼저 홈을 밟았다. 이 플레이의 결과는?", options: ["플라이 아웃 시 주자는 진루할 수 없으므로 3루 주자는 아웃 처리된다.", "포스 아웃 상황이므로 수비수가 홈 베이스만 밟아도 주자가 아웃된다.", "정당한 리터치(태그 업) 성공으로 공격 팀의 1점 득점이 인정된다.", "타자가 아웃되었으므로 해당 이닝의 모든 공격 플레이가 무효 처리된다."] },
        { id: 13, type: 'multiple-choice', points: 2, correctAnswer: 3, text: "'포스 아웃(Force Out)'에 대한 설명으로 가장 올바른 것은?", options: ["태건이가 뜬공을 쳤을 때 수비수 진희가 공중에 떠 있는 공을 직접 잡아서 아웃시키는 것이다.", "타자 준하가 공을 치고 2루로 뛸 때 2루수 민혁이가 글러브로 태그해서 아웃시키는 것이다.", "민수가 투수가 던진 공을 3번 연속 헛스윙 당해서 아웃이 된 경우이다.", "주자 1루 상황, 1루주자인 혜슬이가 다음 타자 땅볼 때 2루로 향할 때 공을 잡아 2루 베이스를 밟아 아웃시킨 경우이다."] },
        { id: 14, type: 'multiple-choice', points: 2, correctAnswer: 2, text: "다음 실전 경기 상황 중 수비수가 베이스만 밟아서는 아웃시킬 수 없고, 반드시 주자의 몸을 공이나 공을 쥔 글러브로 '태그'해야만 아웃(태그아웃)시킬 수 있는 경우는?", options: ["주자가 없는 상황에서 타자가 땅볼을 치고 1루로 달려가는 상황", "주자 1루 상황에서 타자가 땅볼을 쳤을 때, 1루주자가 2루로 달려가는 상황", "주자 2루 상황(1루는 비어있음)에서, 2루 주자가 타격 직후 3루로 진루를 시도하는 상황", "주자 1, 2루 상황에서 타자가 땅볼을 쳤을 때, 2루주자가 3루로 달려가는 상황"] }
      ];
      
      const maxTotalScore = questions.reduce((sum, q) => sum + q.points, 0);

      useEffect(() => {
        if (examStatus !== 'setup') sessionStorage.setItem('current_exam_state', examStatus);
        const handleBeforeUnload = (e) => { if (examStatus === 'running') { e.preventDefault(); e.returnValue = ''; } };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [examStatus]);

      useEffect(() => {
        const handleVisibilityChange = () => { if (document.hidden && examStatus === 'running') setExamStatus('terminated'); };
        const handleWindowBlur = () => { if (examStatus === 'running') setExamStatus('terminated'); };
        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('blur', handleWindowBlur);
        return () => { document.removeEventListener('visibilitychange', handleVisibilityChange); window.removeEventListener('blur', handleWindowBlur); };
      }, [examStatus]);

      useEffect(() => {
        if (examStatus === 'running') {
          timerRef.current = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) { clearInterval(timerRef.current); handleSubmitExam(); return 0; }
              return prev - 1;
            });
          }, 1000);
        }
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, [examStatus, answers]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60); const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleSubmitExam = async () => {
        setIsSaving(true);
        let totalScore = 0;
        questions.forEach(q => {
          if (q.type === 'short-answer') { if (String(answers[q.id] || '').trim() === String(q.correctAnswer)) totalScore += q.points; } 
          else { if (answers[q.id] === q.correctAnswer) totalScore += q.points; }
        });

        const submissionData = { grade: studentInfo.grade, classNo: studentInfo.classNo, studentNo: studentInfo.studentNo, name: studentInfo.name, score: totalScore, maxScore: maxTotalScore };

        try {
          const response = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'saveSubmission', data: submissionData })
          });
          
          const res = await response.json();
          setIsSaving(false);
          
          if (res.success) {
            localStorage.setItem(`exam_done_${studentInfo.grade}_${studentInfo.classNo}_${studentInfo.studentNo}_${studentInfo.name}`, 'true');
            setExamStatus('finished');
          } else {
            // undefined 에러 방지: 구글 서버에서 보낸 에러 메시지를 명확하게 표시
            setAlertMessage("저장 실패: " + (res.error || res.message || "서버 통신 중 알 수 없는 오류가 발생했습니다."));
          }
        } catch (error) {
          setIsSaving(false); 
          setAlertMessage("서버 연결 실패: 인터넷 연결을 확인하거나 관리자에게 문의하세요. (" + error.toString() + ")");
        }
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setAdminError('데이터를 불러오는 중입니다...');
        try {
          const response = await fetch(`${GAS_URL}?action=getAdminData&password=${adminPassword}`);
          const res = await response.json();
          if (res.success) {
            const sorted = res.data.sort((a, b) => { if (a.classNo !== b.classNo) return a.classNo - b.classNo; return a.studentNo - b.studentNo; });
            setSubmissions(sorted); setAdminError(''); setExamStatus('admin-dashboard'); setSelectedClassFilter('all');
          } else { setAdminError(res.message || res.error || '오류 발생'); }
        } catch (error) { setAdminError("오류: " + error.toString()); }
      };

      const exportToCSV = () => {
        const BOM = "\uFEFF"; let csvContent = BOM; const headers = "학년,반,번호,이름,점수,만점,제출시간\n";
        if (selectedClassFilter === 'all') {
          [...Array(12)].forEach((_, i) => {
            const classSubs = submissions.filter(sub => sub.classNo === i + 1);
            if (classSubs.length > 0) {
              csvContent += `\n[2학년 ${i + 1}반]\n` + headers;
              classSubs.forEach(sub => { csvContent += `${sub.grade},${sub.classNo},${sub.studentNo},${sub.name},${sub.score},${sub.maxScore},"${sub.timestamp}"\n`; });
            }
          });
        } else {
          csvContent += headers; const classSubs = submissions.filter(sub => sub.classNo === selectedClassFilter);
          classSubs.forEach(sub => { csvContent += `${sub.grade},${sub.classNo},${sub.studentNo},${sub.name},${sub.score},${sub.maxScore},"${sub.timestamp}"\n`; });
        }
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob);
        const link = document.createElement("a"); link.href = url;
        link.setAttribute("download", selectedClassFilter === 'all' ? '전체결과.csv' : `2학년_${selectedClassFilter}반.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const confirmDeleteSubmission = async () => {
        const student = deleteTarget; setDeleteTarget(null);
        try {
          const response = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'deleteSubmission', classNo: student.classNo, studentNo: student.studentNo, name: student.name })
          });
          const res = await response.json();
          if (res.success) {
            setSubmissions(prev => prev.filter(s => !(s.classNo === student.classNo && s.studentNo === student.studentNo && s.name === student.name)));
            setAlertMessage('초기화 성공! 학생이 재시험을 볼 수 있습니다.');
          } else { setAlertMessage('초기화 실패: ' + (res.error || res.message)); }
        } catch (error) { setAlertMessage('서버 연결 실패'); }
      };

      const CustomAlert = () => (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 className="text-xl font-bold text-center mb-4 text-gray-800">알림</h3>
            <p className="text-center text-gray-600 mb-6 font-medium">{alertMessage}</p>
            <button onClick={() => setAlertMessage('')} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">확인</button>
          </div>
        </div>
      );

      const CustomConfirmDelete = () => (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border-t-4 border-red-500">
            <h3 className="text-xl font-bold text-center mb-4 text-gray-800">초기화 확인</h3>
            <p className="text-center text-gray-600 mb-6">{deleteTarget.classNo}반 {deleteTarget.studentNo}번 {deleteTarget.name} 학생의 기록을 정말 삭제하시겠습니까?</p>
            <div className="flex space-x-3">
              <button onClick={() => setDeleteTarget(null)} className="flex-1 py-3 bg-gray-100 rounded-xl font-bold">취소</button>
              <button onClick={confirmDeleteSubmission} className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold">초기화 진행</button>
            </div>
          </div>
        </div>
      );

      const renderSetupView = () => (
        <div className="flex flex-col items-center justify-center min-h-screen p-4 relative">
          <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div className="text-center text-5xl mb-4">📝</div>
            <h1 className="text-2xl font-bold text-center mb-2 text-gray-800">2학년 체육 온라인 시험</h1>
            <p className="text-center text-gray-500 mb-8 text-sm">본인의 반과 번호, 이름을 정확히 입력해주세요.</p>

            <div className="space-y-4">
              <div className="flex space-x-4">
                <div className="flex-1">
                  <label className="block text-sm font-medium text-gray-700 mb-1">반</label>
                  <select className="w-full p-3 border border-gray-300 rounded-lg outline-none" value={studentInfo.classNo} onChange={(e) => setStudentInfo({...studentInfo, classNo: parseInt(e.target.value)})}>
                    {[...Array(12)].map((_, i) => (<option key={i+1} value={i+1}>{i+1}반</option>))}
                  </select>
                </div>
                <div className="flex-1">
                  <label className="block text-sm font-medium text-gray-700 mb-1">번호</label>
                  <select className="w-full p-3 border border-gray-300 rounded-lg outline-none" value={studentInfo.studentNo} onChange={(e) => setStudentInfo({...studentInfo, studentNo: parseInt(e.target.value)})}>
                    {[...Array(30)].map((_, i) => (<option key={i+1} value={i+1}>{i+1}번</option>))}
                  </select>
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">이름</label>
                <input type="text" placeholder="이름을 입력하세요" className="w-full p-3 border border-gray-300 rounded-lg outline-none" value={studentInfo.name} onChange={(e) => setStudentInfo({...studentInfo, name: e.target.value})} />
              </div>
            </div>

            <div className="mt-8 bg-red-50 p-4 rounded-lg border border-red-100 flex items-start">
              <span className="mr-2">⚠️</span>
              <p className="text-sm text-red-700 font-medium">주의: 창을 이탈하거나 새로고침하면 즉시 0점으로 강제 종료됩니다.</p>
            </div>

            <button onClick={() => { 
              if (localStorage.getItem(`exam_done_${studentInfo.grade}_${studentInfo.classNo}_${studentInfo.studentNo}_${studentInfo.name}`) === 'true') {
                setAlertMessage("이미 답안을 제출한 학생입니다. 재시험은 불가능합니다."); return;
              }
              setExamStatus('running'); setTimeLeft(EXAM_TIME_SECONDS); setCurrentQuestionIndex(0); 
            }} disabled={!studentInfo.name.trim()} className={`w-full mt-6 p-4 rounded-xl font-bold text-lg transition-all ${studentInfo.name.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
              시험 시작하기
            </button>
          </div>
          <button onClick={() => setExamStatus('admin-login')} className="absolute bottom-6 right-6 p-3 text-2xl" title="관리자 모드">🔒</button>
        </div>
      );

      const renderExamView = () => {
        const q = questions[currentQuestionIndex];
        return (
          <div className="min-h-screen flex flex-col">
            <header className="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-10">
              <h2 className="text-xl font-bold">2학년 체육 온라인 시험</h2>
              <div className="flex items-center space-x-4">
                <div className={`font-mono text-xl font-bold px-4 py-2 rounded-lg ${timeLeft <= 300 ? 'bg-red-50 text-red-600 animate-pulse' : 'bg-gray-100'}`}>⏱️ {formatTime(timeLeft)}</div>
                <span className="text-gray-600 hidden sm:inline">{studentInfo.classNo}반 {studentInfo.studentNo}번 {studentInfo.name}</span>
              </div>
            </header>

            <main className="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
              <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div className="bg-blue-600 h-2.5 rounded-full" style={{ width: `${((currentQuestionIndex + 1) / questions.length) * 100}%` }}></div>
              </div>

              <div className="bg-white rounded-xl shadow-sm p-6 sm:p-8 flex-1 flex flex-col">
                <h3 className="text-xl font-medium mb-8 leading-relaxed">
                  <span className="font-bold text-blue-600 text-2xl mr-3">{currentQuestionIndex + 1}.</span> {q.text}
                  <span className="inline-block ml-3 px-3 py-1 bg-blue-50 text-blue-600 text-sm font-bold rounded-lg border border-blue-100">{q.points}점</span>
                </h3>
                <div className="space-y-4 mb-auto">
                  {q.type === 'short-answer' ? (
                    <input type="text" value={answers[q.id] || ''} onChange={(e) => setAnswers({...answers, [q.id]: e.target.value})} placeholder="정답을 입력하세요" className="w-full p-4 text-lg border-2 border-gray-300 rounded-xl outline-none focus:border-blue-500" />
                  ) : (
                    q.options.map((opt, idx) => (
                      <label key={idx} className={`flex items-center p-5 border-2 rounded-xl cursor-pointer ${answers[q.id] === idx ? 'border-blue-500 bg-blue-50' : 'border-gray-100 hover:bg-gray-50'}`}>
                        <input type="radio" checked={answers[q.id] === idx} onChange={() => setAnswers({...answers, [q.id]: idx})} className="w-5 h-5 text-blue-600" />
                        <span className="ml-4 text-lg">{opt}</span>
                      </label>
                    ))
                  )}
                </div>
              </div>

              <div className="mt-6 flex justify-between">
                <button onClick={() => setCurrentQuestionIndex(prev => Math.max(0, prev - 1))} disabled={currentQuestionIndex === 0} className={`px-6 py-3 rounded-lg font-medium ${currentQuestionIndex === 0 ? 'bg-gray-200 text-gray-400' : 'bg-white border hover:bg-gray-50'}`}>⬅️ 이전</button>
                {currentQuestionIndex === questions.length - 1 ? (
                  <button onClick={() => setShowConfirmModal(true)} className="px-8 py-3 bg-gray-900 text-white rounded-xl font-bold">제출하기 ✅</button>
                ) : (
                  <button onClick={() => setCurrentQuestionIndex(prev => Math.min(questions.length - 1, prev + 1))} className="px-8 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">다음 ➡️</button>
                )}
              </div>
            </main>

            {showConfirmModal && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl border-t-8 border-red-500">
                  <h3 className="text-2xl font-bold text-center mb-2">최종 제출 확인</h3>
                  <p className="text-center text-gray-600 mb-6">제출하면 더 이상 수정할 수 없습니다.<br/>정말 제출하시겠습니까?</p>
                  <div className="flex space-x-3">
                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 py-3 bg-gray-100 rounded-xl font-bold">취소</button>
                    <button onClick={() => { setShowConfirmModal(false); handleSubmitExam(); }} disabled={isSaving} className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">{isSaving ? '저장 중...' : '제출 완료 ✅'}</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderAdminDashboard = () => (
        <div className="min-h-screen p-4 sm:p-8">
          <div className="max-w-6xl mx-auto">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-3xl font-bold">👥 반별 학생 제출 현황 (2학년)</h1>
              <div className="flex space-x-3">
                <button onClick={exportToCSV} className="px-6 py-3 bg-green-600 text-white rounded-xl font-bold">📥 엑셀 다운로드</button>
                <button onClick={() => { setExamStatus('setup'); setAdminPassword(''); }} className="px-6 py-3 bg-gray-200 rounded-xl font-bold">🚪 나가기</button>
              </div>
            </div>
            
            <div className="flex overflow-x-auto space-x-2 mb-8 pb-2">
              <button onClick={() => setSelectedClassFilter('all')} className={`px-5 py-2 rounded-full font-bold ${selectedClassFilter === 'all' ? 'bg-gray-800 text-white' : 'bg-white border'}`}>전체 보기</button>
              {[...Array(12)].map((_, i) => (<button key={i} onClick={() => setSelectedClassFilter(i + 1)} className={`px-5 py-2 rounded-full font-bold ${selectedClassFilter === i + 1 ? 'bg-blue-600 text-white' : 'bg-white border'}`}>{i + 1}반</button>))}
            </div>

            {selectedClassFilter === 'all' ? [...Array(12)].map((_, i) => {
              const classSubs = submissions.filter(s => s.classNo === i + 1);
              if(classSubs.length === 0) return null;
              return (
                <div key={i} className="bg-white rounded-2xl shadow-sm border mb-8 overflow-hidden">
                  <div className="bg-blue-50 px-6 py-4 font-bold text-blue-800 border-b">2학년 {i+1}반 (제출: {classSubs.length}명)</div>
                  <table className="w-full text-left"><thead className="bg-gray-100"><tr><th className="p-4">번호</th><th className="p-4">이름</th><th className="p-4">점수</th><th className="p-4 text-center">관리</th></tr></thead>
                    <tbody>
                      {classSubs.map(s => <tr key={s.studentNo+s.name} className="border-b"><td className="p-4">{s.studentNo}번</td><td className="p-4 font-bold">{s.name}</td><td className="p-4 text-blue-600 font-bold">{s.score}/{s.maxScore}</td><td className="p-4 text-center"><button onClick={() => setDeleteTarget(s)} className="px-3 py-1 bg-red-100 text-red-600 rounded-lg text-sm font-bold">초기화</button></td></tr>)}
                    </tbody>
                  </table>
                </div>
              );
            }) : (
              <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div className="bg-blue-50 px-6 py-4 font-bold text-blue-800 border-b">2학년 {selectedClassFilter}반</div>
                <table className="w-full text-left"><thead className="bg-gray-100"><tr><th className="p-4">번호</th><th className="p-4">이름</th><th className="p-4">점수</th><th className="p-4 text-center">관리</th></tr></thead>
                  <tbody>
                    {submissions.filter(s => s.classNo === selectedClassFilter).map(s => <tr key={s.studentNo+s.name} className="border-b"><td className="p-4">{s.studentNo}번</td><td className="p-4 font-bold">{s.name}</td><td className="p-4 text-blue-600 font-bold">{s.score}/{s.maxScore}</td><td className="p-4 text-center"><button onClick={() => setDeleteTarget(s)} className="px-3 py-1 bg-red-100 text-red-600 rounded-lg text-sm font-bold">초기화</button></td></tr>)}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );

      return (
        <div className="app-container">
          {examStatus === 'setup' && renderSetupView()}
          {examStatus === 'running' && renderExamView()}
          {examStatus === 'terminated' && <div className="flex min-h-screen items-center justify-center bg-red-50 p-4"><div className="bg-white p-10 rounded-2xl shadow-xl text-center border-t-8 border-red-500"><div className="text-6xl mb-4">🚫</div><h1 className="text-3xl font-bold mb-4">시험 강제 종료</h1><p>부정행위(창 이탈/새로고침)로 간주되었습니다.</p></div></div>}
          {examStatus === 'finished' && <div className="flex min-h-screen items-center justify-center bg-blue-50 p-4"><div className="bg-white p-10 rounded-2xl shadow-xl text-center"><div className="text-6xl mb-4">✅</div><h1 className="text-3xl font-bold mb-4">제출 완료</h1><p className="text-gray-600 mb-6"><span className="font-bold text-blue-700">{studentInfo.name}</span> 학생의 답안이 제출되었습니다.</p><div className="bg-gray-100 p-4 rounded-lg font-bold">이제 창을 완전히 닫아주세요.</div></div></div>}
          {examStatus === 'admin-dashboard' && renderAdminDashboard()}
          {examStatus === 'admin-login' && (
            <div className="min-h-screen flex items-center justify-center p-4">
              <form onSubmit={handleAdminLogin} className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
                <h2 className="text-2xl font-bold text-center mb-6">관리자 로그인</h2>
                <input type="password" placeholder="비밀번호를 입력하세요" className="w-full p-4 border rounded-xl mb-4" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} />
                {adminError && <p className="text-red-500 mb-4 text-center text-sm font-bold bg-red-50 p-2 rounded">{adminError}</p>}
                <button className="w-full py-4 bg-gray-900 text-white rounded-xl font-bold mb-2">접속하기</button>
                <button type="button" onClick={() => setExamStatus('setup')} className="w-full py-3 bg-gray-100 rounded-xl">돌아가기</button>
              </form>
            </div>
          )}
          {alertMessage && <CustomAlert />}
          {deleteTarget && <CustomConfirmDelete />}
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
